[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disable_error_code = var-annotated, no-redef, import-untyped, unused-ignore

# Files/dirs excluded from strict type checking (legacy VBA-adjacent scripts with heavy COM use).
exclude = scripts/watch-template-sync.py, scripts/monitor-logs.py, scripts/run-report.py, scripts/excel_guard.py
